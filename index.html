<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>نظام إدخال البيانات</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style>

*{
box-sizing:border-box;
font-family:Tahoma;
}

body{
margin:0;
background:#ede7f6;
padding:20px;
}

.container{
max-width:950px;
margin:auto;
}

.top{
height:10px;
background:#673ab7;
border-radius:16px 16px 0 0;
}

.form{
background:#fff;
padding:25px;
border-radius:0 0 16px 16px;
}

.title{
font-size:32px;
margin-bottom:20px;
}

.card{
background:#fff;
border:1px solid #ddd;
border-radius:14px;
padding:20px;
margin-bottom:18px;
}

.label{
display:block;
margin-bottom:10px;
font-size:18px;
}

input[type=text]{
width:100%;
border:none;
border-bottom:2px solid #ccc;
padding:12px;
font-size:16px;
outline:none;
}

input[type=text]:focus{
border-bottom:2px solid #673ab7;
}

.uploadBox{
border:2px dashed #673ab7;
padding:15px;
border-radius:12px;
text-align:center;
background:#faf7ff;
margin-top:10px;
}

.preview{
width:120px;
height:120px;
object-fit:cover;
margin-top:10px;
border-radius:12px;
display:block;
}

.toolbar{
position:fixed;
left:20px;
top:120px;
background:#fff;
border-radius:14px;
padding:10px;
display:flex;
flex-direction:column;
gap:10px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
z-index:999;
}

.toolBtn{
width:55px;
height:55px;
border:none;
border-radius:12px;
font-size:24px;
cursor:pointer;
background:#673ab7;
color:#fff;
}

.btn{
background:#16a34a;
color:#fff;
border:none;
border-radius:10px;
padding:15px;
width:100%;
font-size:18px;
cursor:pointer;
margin-top:10px;
}

.addImgBtn{
background:#673ab7;
color:#fff;
border:none;
border-radius:10px;
padding:10px;
cursor:pointer;
margin-top:10px;
}

.copyBtn{
background:#1a73e8;
color:#fff;
border:none;
border-radius:10px;
padding:10px;
margin-top:10px;
cursor:pointer;
}

.adminBtn{
background:#111;
color:#fff;
border:none;
border-radius:10px;
padding:12px;
width:100%;
font-size:16px;
margin-top:10px;
cursor:pointer;
}

.progressBox{
width:100%;
height:28px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}

.progressBar{
height:100%;
width:0%;
background:#673ab7;
color:#fff;
text-align:center;
line-height:28px;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
margin-bottom:25px;
}

th,td{
border:1px solid #ccc;
padding:10px;
text-align:center;
vertical-align:middle;
}

th{
background:#673ab7;
color:#fff;
}

.searchBox{
width:100%;
padding:14px;
margin-bottom:20px;
border-radius:10px;
border:1px solid #ccc;
font-size:18px;
}

@media(max-width:900px){

.toolbar{
position:fixed;
left:10px;
top:100px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="toolbar">

<button class="toolBtn"
onclick="addField()">
+
</button>

</div>

<div class="top"></div>

<div class="form">

<div class="title">
نظام إدخال البيانات
</div>

<div id="questions"></div>

<button class="btn"
onclick="sendData()">

إرسال

</button>

<button class="adminBtn"
onclick="requestAdminAccess()">

لوحة الإدارة

</button>

</div>

</div>

<script>

const ADMIN_PASSWORD =
"481481";

let db;

let request =
indexedDB.open("DataSystemDB",1);

request.onupgradeneeded = function(e){

db = e.target.result;

if(!db.objectStoreNames.contains("records")){

db.createObjectStore(
"records",
{
keyPath:"id",
autoIncrement:true
}
);

}

};

request.onsuccess = function(e){

db = e.target.result;

};

// أول مجموعة

createGroup();

function requestAdminAccess(){

let pass =
prompt("أدخل كلمة المرور");

if(pass === ADMIN_PASSWORD){

openStoragePage();

}else{

alert("كلمة المرور غير صحيحة");

}

}

function createGroup(){

let questions =
document.getElementById("questions");

// اسم الموقع

let siteCard =
document.createElement("div");

siteCard.className = "card";

siteCard.innerHTML = `

<label class="label">
اسم الموقع
</label>

<input type="text"
class="groupSiteName"
placeholder="اكتب اسم الموقع">

`;

questions.appendChild(siteCard);

// رابط الموقع

let linkCard =
document.createElement("div");

linkCard.className = "card";

linkCard.innerHTML = `

<label class="label">
رابط الموقع من الخريطة
</label>

<input type="text"
class="groupSiteLink"
readonly>

<button class="copyBtn"
onclick="copyCurrentLocation(this)">

نسخ رابط الموقع الحالي

</button>

`;

questions.appendChild(linkCard);

}

function copyCurrentLocation(btn){

navigator.geolocation.getCurrentPosition(function(pos){

let lat = pos.coords.latitude;
let lng = pos.coords.longitude;

let link =
"https://maps.google.com/?q="
+ lat + "," + lng;

btn.parentElement
.querySelector("input")
.value = link;

navigator.clipboard.writeText(link);

alert("تم نسخ الرابط");

});

}

function addField(defaultTitle = ""){

let questions =
document.getElementById("questions");

let currentFields =
questions.querySelectorAll(".dynamicField");

// كل مجموعة = 5
// اسم الموقع + الرابط + 3 حقول

if(
currentFields.length > 0
&&
currentFields.length % 3 == 0
){

createGroup();

}

let div =
document.createElement("div");

div.className =
"card dynamicField";

div.innerHTML = `

<input type="text"
class="fieldName"
placeholder="اكتب اسم العمود"
value="${defaultTitle}">

<br><br>

<input type="text"
class="fieldValue"
placeholder="اكتب القيمة">

<br><br>

<button type="button"
class="addImgBtn">

+ إضافة صور

</button>

<div class="imagesContainer"></div>

`;

questions.appendChild(div);

let addBtn =
div.querySelector(".addImgBtn");

let container =
div.querySelector(".imagesContainer");

addBtn.onclick = function(){

let box =
document.createElement("div");

box.className = "uploadBox";

box.innerHTML = `

<input type="file"
class="extraImage"
accept="image/*">

<br><br>

<img class="preview">

`;

container.appendChild(box);

let imgInput =
box.querySelector(".extraImage");

let preview =
box.querySelector(".preview");

imgInput.addEventListener("change",function(e){

let file = e.target.files[0];

if(!file) return;

let reader =
new FileReader();

reader.onload = function(ev){

preview.src =
ev.target.result;

}

reader.readAsDataURL(file);

});

}

}

addField("رقم البلاغ");

function sendData(){

let row = {};

let siteNames =
document.querySelectorAll(".groupSiteName");

let siteLinks =
document.querySelectorAll(".groupSiteLink");

siteNames.forEach((s,i)=>{

row[
"اسم الموقع " + (i+1)
] = s.value;

});

siteLinks.forEach((s,i)=>{

row[
"رابط الموقع " + (i+1)
] = s.value;

});

let cards =
document.querySelectorAll(".dynamicField");

cards.forEach((card,index)=>{

let name =
card.querySelector(".fieldName");

let value =
card.querySelector(".fieldValue");

if(name && value){

row[name.value] =
value.value;

let previews =
card.querySelectorAll(".preview");

previews.forEach((img,imgIndex)=>{

if(img.src){

row[
name.value +
" صورة " +
(imgIndex+1)

] = img.src;

}

});

}

});

let tx =
db.transaction(
"records",
"readwrite"
);

let store =
tx.objectStore("records");

store.add(row);

tx.oncomplete = function(){

alert("تم إرسال البيانات");

}

}

function openStoragePage(){

document.body.innerHTML = `

<div style="
padding:20px;
background:#f5f5f5;
min-height:100vh;
">

<h2>
البيانات المستلمة
</h2>

<button
onclick="exportExcel()"
style="
background:#1a73e8;
color:#fff;
border:none;
padding:14px;
border-radius:10px;
width:100%;
font-size:18px;
margin-bottom:10px;
cursor:pointer;
">

تصدير Excel

</button>

<button
onclick="clearDatabase()"
style="
background:#dc2626;
color:#fff;
border:none;
padding:14px;
border-radius:10px;
width:100%;
font-size:18px;
margin-bottom:20px;
cursor:pointer;
">

تفريغ البيانات

</button>

<div class="progressBox">

<div class="progressBar"
id="storageBar">

0%

</div>

</div>

<div id="tableContainer"></div>

</div>

`;

loadStorageData();

}

function loadStorageData(){

let tx =
db.transaction(
"records",
"readonly"
);

let store =
tx.objectStore("records");

let getAll =
store.getAll();

getAll.onsuccess = function(){

let data =
getAll.result;

renderStorageTable(data);

updateStorageBar(data);

}

}

function renderStorageTable(data){

let div =
document.getElementById(
"tableContainer"
);

if(data.length == 0){

div.innerHTML =
"لا توجد بيانات";

return;

}

let headers = [];

data.forEach(r=>{

Object.keys(r).forEach(k=>{

if(k != "id"){

if(!headers.includes(k)){

headers.push(k);

}

}

});

});

let groups = [];

for(let i=0;i<headers.length;i+=5){

groups.push(
headers.slice(i,i+5)
);

}

let html = `

<input
type="text"
id="searchBox"
class="searchBox"
placeholder="بحث شامل..."
onkeyup="searchTables()"
>

`;

groups.forEach(group=>{

html += "<table>";

html += "<tr>";

group.forEach(h=>{

html += `
<th>
${h}
</th>
`;

});

html += `
<th>
واتساب
</th>
`;

html += "</tr>";

data.forEach((row,rowIndex)=>{

html += `
<tr class="dataRow">
`;

group.forEach(h=>{

let val =
row[h] || "";

if(
typeof val === "string"
&&
val.startsWith("data:image")
){

val = `

<div>

<img
src="${val}"
style="
width:80px;
border-radius:10px;
display:block;
margin:auto;
">

<br>

<label>

<input
type="checkbox"
class="waImage"
data-row="${rowIndex}"
data-img="${val}"
checked>

إرسال

</label>

</div>

`;

}

html += `
<td>
${val}
</td>
`;

});

html += `
<td>

<button
onclick="sendWhatsApp(${rowIndex})"
style="
background:#25D366;
color:#fff;
border:none;
padding:10px;
border-radius:10px;
cursor:pointer;
">

واتساب

</button>

</td>
`;

html += "</tr>";

});

html += "</table>";

});

div.innerHTML = html;

window.currentTableData = data;

}

function searchTables(){

let val =
document.getElementById(
"searchBox"
)
.value
.toLowerCase();

let rows =
document.querySelectorAll(
".dataRow"
);

rows.forEach(row=>{

let txt =
row.innerText.toLowerCase();

if(txt.includes(val)){

row.style.display = "";

}else{

row.style.display = "none";

}

});

}

function updateStorageBar(data){

let text =
JSON.stringify(data);

let size =
new Blob([text]).size;

let max =
50 * 1024 * 1024;

let percent =
Math.min(
(size / max) * 100,
100
);

let bar =
document.getElementById(
"storageBar"
);

bar.style.width =
percent + "%";

bar.innerHTML =
percent.toFixed(1) + "%";

}

function clearDatabase(){

let ok =
confirm(
"هل تريد حذف جميع البيانات؟"
);

if(!ok) return;

let tx =
db.transaction(
"records",
"readwrite"
);

let store =
tx.objectStore("records");

store.clear();

alert("تم تفريغ البيانات");

loadStorageData();

}

async function sendWhatsApp(index){

let row =
window.currentTableData[index];

let text = "";

Object.keys(row).forEach(k=>{

if(k != "id"){

let val = row[k];

if(
!(
typeof val === "string"
&&
val.startsWith("data:image")
)
){

text += val + "\n";

}

}

});

let selectedImages =
document.querySelectorAll(
'.waImage[data-row="'+index+'"]:checked'
);

if(selectedImages.length == 0){

alert("اختر صورة");

return;

}

let imgSrc =
selectedImages[0]
.getAttribute("data-img");

function dataURLtoFile(dataurl, filename){

let arr = dataurl.split(',');

let mime =
arr[0].match(/:(.*?);/)[1];

let bstr =
atob(arr[1]);

let n =
bstr.length;

let u8arr =
new Uint8Array(n);

while(n--){

u8arr[n] =
bstr.charCodeAt(n);

}

return new File(
[u8arr],
filename,
{type:mime}
);

}

let file =
dataURLtoFile(
imgSrc,
"whatsapp-image.jpg"
);

try{

if(
navigator.canShare &&
navigator.canShare({
files:[file]
})
){

await navigator.share({

files:[file],

text:text

});

}else{

window.open(

"https://wa.me/?text=" +
encodeURIComponent(text),

"_blank"

);

}

}catch(e){

alert("فشل الإرسال");

}

}

async function exportExcel(){

let tx =
db.transaction(
"records",
"readonly"
);

let store =
tx.objectStore("records");

let getAll =
store.getAll();

getAll.onsuccess =
async function(){

let data =
getAll.result;

if(data.length == 0){

alert("لا توجد بيانات");

return;

}

let workbook =
new ExcelJS.Workbook();

let sheet =
workbook.addWorksheet(
"البيانات"
);

let headers = [];

data.forEach(r=>{

Object.keys(r).forEach(k=>{

if(k != "id"){

if(!headers.includes(k)){

headers.push(k);

}

}

});

});

let groups = [];

for(let i=0;i<headers.length;i+=5){

groups.push(
headers.slice(i,i+5)
);

}

let currentRow = 1;

for(let g=0; g<groups.length; g++){

let group =
groups[g];

sheet.addRow(group);

group.forEach((h,index)=>{

let cell =
sheet.getCell(
currentRow,
index + 1
);

cell.font = {
bold:true,
color:{argb:"FFFFFF"}
};

cell.fill = {
type:"pattern",
pattern:"solid",
fgColor:{argb:"673AB7"}
};

});

currentRow++;

for(let i=0;i<data.length;i++){

let rowData = [];

group.forEach(h=>{

let val =
data[i][h] || "";

if(
typeof val === "string"
&&
val.startsWith("data:image")
){

rowData.push("");

}else{

rowData.push(val);

}

});

let row =
sheet.addRow(rowData);

row.height = 90;

for(let j=0;j<group.length;j++){

let key =
group[j];

let val =
data[i][key];

if(
typeof val === "string"
&&
val.startsWith("data:image")
){

let extension =
val.includes("image/png")
? "png"
: "jpeg";

let imageId =
workbook.addImage({

base64:val,
extension:extension

});

sheet.addImage(

imageId,

{
tl:{
col:j + 0.15,
row:currentRow - 0.85
},

ext:{
width:85,
height:85
}

}

);

}

}

currentRow++;

}

currentRow += 2;

}

sheet.columns.forEach(col=>{

col.width = 28;

});

let buffer =
await workbook.xlsx.writeBuffer();

saveAs(

new Blob([buffer]),

"البيانات.xlsx"

);

}

}

</script>

</body>

</html>
