<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>نظام المواقع والبلاغات</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style>

*{
box-sizing:border-box;
font-family:tahoma;
}

body{
margin:0;
background:#ede7f6;
padding:20px;
}

.container{
max-width:1100px;
margin:auto;
}

.top{
height:10px;
background:#673ab7;
border-radius:16px 16px 0 0;
}

.form{
background:#fff;
padding:25px;
border-radius:0 0 16px 16px;
}

.title{
font-size:32px;
margin-bottom:20px;
font-weight:bold;
}

.card{
background:#fff;
border:1px solid #ddd;
border-radius:14px;
padding:20px;
margin-bottom:18px;
}

.groupTitle{
background:#673ab7;
color:#fff;
padding:14px;
border-radius:12px;
margin:20px 0 10px;
font-size:20px;
font-weight:bold;
}

.label{
display:block;
margin-bottom:10px;
font-size:18px;
}

input[type=text]{
width:100%;
border:none;
border-bottom:2px solid #ccc;
padding:12px;
font-size:16px;
outline:none;
}

input[type=text]:focus{
border-bottom:2px solid #673ab7;
}

.uploadBox{
border:2px dashed #673ab7;
padding:15px;
border-radius:12px;
background:#faf7ff;
margin-top:10px;
}

.previewGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:10px;
}

.previewItem{
position:relative;
}

.preview{
width:100%;
height:110px;
object-fit:cover;
border-radius:10px;
border:1px solid #ccc;
}

.toolbar{
position:fixed;
left:20px;
top:120px;
z-index:999;
}

.toolBtn{
width:60px;
height:60px;
border:none;
border-radius:14px;
font-size:30px;
background:#673ab7;
color:#fff;
cursor:pointer;
box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.btn{
background:#16a34a;
color:#fff;
border:none;
border-radius:10px;
padding:15px;
width:100%;
font-size:18px;
cursor:pointer;
margin-top:10px;
}

.copyBtn{
background:#1a73e8;
color:#fff;
border:none;
border-radius:10px;
padding:10px;
margin-top:10px;
cursor:pointer;
}

.addImgBtn{
background:#673ab7;
color:#fff;
border:none;
border-radius:10px;
padding:10px;
margin-top:10px;
cursor:pointer;
}

.adminBtn{
background:#111;
color:#fff;
border:none;
border-radius:10px;
padding:12px;
width:100%;
font-size:16px;
margin-top:10px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
margin-bottom:25px;
}

th,td{
border:1px solid #ccc;
padding:10px;
text-align:center;
vertical-align:top;
}

th{
background:#673ab7;
color:#fff;
}

.imageCell{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:6px;
}

.imageCell img{
width:100%;
height:90px;
object-fit:cover;
border-radius:10px;
border:1px solid #ccc;
}

.searchBox{
width:100%;
padding:14px;
margin-bottom:20px;
border-radius:10px;
border:1px solid #ccc;
font-size:18px;
}

.progressBox{
width:100%;
height:26px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}

.progressBar{
height:100%;
width:0%;
background:#673ab7;
color:#fff;
text-align:center;
line-height:26px;
font-size:14px;
}

</style>

</head>

<body>

<div class="toolbar">

<button class="toolBtn"
onclick="addField()">

+

</button>

</div>

<div class="container">

<div class="top"></div>

<div class="form">

<div class="title">
نظام المواقع والبلاغات
</div>

<div id="questions"></div>

<button class="btn"
onclick="sendData()">

إرسال

</button>

<button class="adminBtn"
onclick="openAdmin()">

لوحة الإدارة

</button>

</div>

</div>

<script>

const ADMIN_PASSWORD = "481481";

let db;

let request =
indexedDB.open("SITE_DB",1);

request.onupgradeneeded = function(e){

db = e.target.result;

if(!db.objectStoreNames.contains("records")){

db.createObjectStore(
"records",
{
keyPath:"id",
autoIncrement:true
}
);

}

};

request.onsuccess = function(e){

db = e.target.result;

};

createGroup();

function createGroup(){

let q =
document.getElementById("questions");

let count =
document.querySelectorAll(".groupBlock").length + 1;

let wrap =
document.createElement("div");

wrap.className = "groupBlock";

wrap.innerHTML = `

<div class="groupTitle">
الموقع ${count}
</div>

<div class="card">

<label class="label">
اسم الموقع
</label>

<input type="text"
class="siteName"
placeholder="اكتب اسم الموقع">

</div>

<div class="card">

<label class="label">
رابط الموقع من الخريطة
</label>

<input type="text"
class="siteLink"
readonly>

<button class="copyBtn"
onclick="copyLocation(this)">

نسخ رابط الموقع الحالي

</button>

</div>

`;

q.appendChild(wrap);

}

function copyLocation(btn){

navigator.geolocation.getCurrentPosition(function(pos){

let lat = pos.coords.latitude;
let lng = pos.coords.longitude;

let link =
"https://maps.google.com/?q="
+ lat + "," + lng;

btn.parentElement
.querySelector(".siteLink")
.value = link;

navigator.clipboard.writeText(link);

alert("تم نسخ الرابط");

});

}

function addField(){

let groups =
document.querySelectorAll(".groupBlock");

let lastGroup =
groups[groups.length-1];

let currentFields =
lastGroup.querySelectorAll(".dynamicField");

// كل موقع = 5 أعمدة
// اسم الموقع + الرابط + 3 حقول

if(currentFields.length >= 3){

createGroup();

groups =
document.querySelectorAll(".groupBlock");

lastGroup =
groups[groups.length-1];

}

let field =
document.createElement("div");

field.className =
"card dynamicField";

field.innerHTML = `

<input type="text"
class="fieldName"
placeholder="اكتب اسم العمود">

<br><br>

<input type="text"
class="fieldValue"
placeholder="اكتب القيمة">

<button
type="button"
class="addImgBtn">

+ إضافة صور

</button>

<div class="previewGrid"></div>

`;

lastGroup.appendChild(field);

let btn =
field.querySelector(".addImgBtn");

btn.onclick = function(){

let grid =
field.querySelector(".previewGrid");

if(
grid.querySelectorAll(".previewItem")
.length >= 4
){

alert("الحد الأقصى 4 صور");

return;

}

let item =
document.createElement("div");

item.className = "previewItem";

item.innerHTML = `

<input type="file"
accept="image/*"
class="imgInput">

<img class="preview">

`;

grid.appendChild(item);

let input =
item.querySelector(".imgInput");

let img =
item.querySelector(".preview");

input.onchange = function(e){

let file = e.target.files[0];

if(!file) return;

let reader =
new FileReader();

reader.onload = function(ev){

img.src =
ev.target.result;

};

reader.readAsDataURL(file);

};

};

}

addField();

function sendData(){

let groups =
document.querySelectorAll(".groupBlock");

let tx =
db.transaction(
"records",
"readwrite"
);

let store =
tx.objectStore("records");

groups.forEach(group=>{

let row = {};

row["اسم الموقع"] =
group.querySelector(".siteName").value;

row["رابط الموقع"] =
group.querySelector(".siteLink").value;

let fields =
group.querySelectorAll(".dynamicField");

fields.forEach(field=>{

let name =
field.querySelector(".fieldName").value;

let value =
field.querySelector(".fieldValue").value;

row[name] = value;

let previews =
field.querySelectorAll(".preview");

previews.forEach((img,i)=>{

if(img.src){

row[
name + " صورة " + (i+1)
] = img.src;

}

});

});

store.add(row);

});

tx.oncomplete = function(){

alert("تم حفظ البيانات");

};

}

function openAdmin(){

let pass =
prompt("أدخل كلمة المرور");

if(pass !== ADMIN_PASSWORD){

alert("كلمة المرور خطأ");

return;

}

document.body.innerHTML = `

<div style="padding:20px">

<h2>
البيانات المستلمة
</h2>

<button
onclick="exportExcel()"
class="btn"
style="background:#1a73e8">

تصدير Excel

</button>

<div class="progressBox">

<div
class="progressBar"
id="storageBar">

0%

</div>

</div>

<input
type="text"
id="searchBox"
class="searchBox"
placeholder="بحث شامل..."
onkeyup="searchTables()">

<div id="tableContainer"></div>

</div>

`;

loadData();

}

function loadData(){

let tx =
db.transaction(
"records",
"readonly"
);

let store =
tx.objectStore("records");

let getAll =
store.getAll();

getAll.onsuccess = function(){

let data =
getAll.result;

renderTables(data);

updateBar(data);

};

}

function renderTables(data){

let div =
document.getElementById(
"tableContainer"
);

div.innerHTML = "";

data.forEach((row,rowIndex)=>{

let table =
document.createElement("table");

let title =
document.createElement("h2");

title.className = "groupTitle";

title.innerText =
row["اسم الموقع"] || "بدون اسم";

div.appendChild(title);

let tr1 =
document.createElement("tr");

Object.keys(row).forEach(k=>{

if(
k != "id"
&&
!k.includes(" صورة ")
){

let th =
document.createElement("th");

th.innerText = k;

tr1.appendChild(th);

}

});

let thWA =
document.createElement("th");

thWA.innerText = "واتساب";

tr1.appendChild(thWA);

table.appendChild(tr1);

let tr2 =
document.createElement("tr");

Object.keys(row).forEach(k=>{

if(
k != "id"
&&
!k.includes(" صورة ")
){

let td =
document.createElement("td");

td.className = "dataRow";

td.innerHTML = `
<div>
${row[k]}
</div>
`;

let imgs = [];

Object.keys(row).forEach(imgKey=>{

if(
imgKey.startsWith(k + " صورة")
){

imgs.push(row[imgKey]);

}

});

if(imgs.length){

let box =
document.createElement("div");

box.className =
"imageCell";

imgs.forEach(img=>{

box.innerHTML += `

<div>

<img src="${img}">

<label>

<input
type="checkbox"
class="waImage"
data-row="${rowIndex}"
data-img="${img}"
checked>

إرسال

</label>

</div>

`;

});

td.appendChild(box);

}

tr2.appendChild(td);

}

});

let tdWA =
document.createElement("td");

tdWA.innerHTML = `

<button
onclick="sendWhatsApp(${rowIndex})"
style="
background:#25D366;
color:#fff;
border:none;
padding:10px;
border-radius:10px;
cursor:pointer;
">

واتساب

</button>

`;

tr2.appendChild(tdWA);

table.appendChild(tr2);

div.appendChild(table);

});

window.currentTableData = data;

}

function searchTables(){

let val =
document.getElementById(
"searchBox"
)
.value
.toLowerCase();

let tables =
document.querySelectorAll("table");

tables.forEach(t=>{

if(
t.innerText
.toLowerCase()
.includes(val)
){

t.style.display = "";

}else{

t.style.display = "none";

}

});

}

function updateBar(data){

let text =
JSON.stringify(data);

let size =
new Blob([text]).size;

let max =
50 * 1024 * 1024;

let percent =
Math.min(
(size/max)*100,
100
);

let bar =
document.getElementById(
"storageBar"
);

bar.style.width =
percent + "%";

bar.innerHTML =
percent.toFixed(1) + "%";

}

async function sendWhatsApp(index){

let row =
window.currentTableData[index];

let text = "";

Object.keys(row).forEach(k=>{

if(
k != "id"
&&
!k.includes(" صورة ")
){

text +=
k + " : " +
row[k] + "\n";

}

});

let selected =
document.querySelectorAll(
'.waImage[data-row="'+index+'"]:checked'
);

if(!selected.length){

alert("اختر صورة");

return;

}

let imgSrc =
selected[0]
.getAttribute("data-img");

function dataURLtoFile(dataurl, filename){

let arr = dataurl.split(',');

let mime =
arr[0].match(/:(.*?);/)[1];

let bstr =
atob(arr[1]);

let n =
bstr.length;

let u8arr =
new Uint8Array(n);

while(n--){

u8arr[n] =
bstr.charCodeAt(n);

}

return new File(
[u8arr],
filename,
{type:mime}
);

}

let file =
dataURLtoFile(
imgSrc,
"image.jpg"
);

try{

if(
navigator.canShare &&
navigator.canShare({
files:[file]
})
){

await navigator.share({

files:[file],
text:text

});

}else{

window.open(
"https://wa.me/?text=" +
encodeURIComponent(text),
"_blank"
);

}

}catch(e){

alert("فشل الإرسال");

}

}

async function exportExcel(){

let tx =
db.transaction(
"records",
"readonly"
);

let store =
tx.objectStore("records");

let getAll =
store.getAll();

getAll.onsuccess =
async function(){

let data =
getAll.result;

if(!data.length){

alert("لا توجد بيانات");

return;

}

let workbook =
new ExcelJS.Workbook();

let sheet =
workbook.addWorksheet(
"البيانات"
);

let currentRow = 1;

for(let r=0;r<data.length;r++){

let rowData =
data[r];

// عنوان الموقع

sheet.mergeCells(
`A${currentRow}:F${currentRow}`
);

let title =
sheet.getCell(
`A${currentRow}`
);

title.value =
rowData["اسم الموقع"];

title.font = {
bold:true,
size:18,
color:{argb:"FFFFFF"}
};

title.fill = {
type:"pattern",
pattern:"solid",
fgColor:{argb:"673AB7"}
};

currentRow++;

// العناوين

let headers = [];

Object.keys(rowData).forEach(k=>{

if(
k != "id"
&&
!k.includes(" صورة ")
){

headers.push(k);

}

});

sheet.addRow(headers);

headers.forEach((h,i)=>{

let cell =
sheet.getCell(
currentRow,
i+1
);

cell.font = {
bold:true,
color:{argb:"FFFFFF"}
};

cell.fill = {
type:"pattern",
pattern:"solid",
fgColor:{argb:"7E57C2"}
};

});

currentRow++;

// البيانات

let values = [];

headers.forEach(h=>{

values.push(
rowData[h] || ""
);

});

let row =
sheet.addRow(values);

row.height = 220;

// الصور داخل نفس الخلية

for(let c=0;c<headers.length;c++){

let key =
headers[c];

let images = [];

Object.keys(rowData).forEach(imgKey=>{

if(
imgKey.startsWith(
key + " صورة"
)
){

images.push(
rowData[imgKey]
);

}

});

images
.slice(0,4)
.forEach((img,index)=>{

let extension =
img.includes("png")
? "png"
: "jpeg";

let imageId =
workbook.addImage({

base64:img,
extension:extension

});

let colOffset =
(index % 2) * 0.45;

let rowOffset =
(index >= 2 ? 0.45 : 0);

sheet.addImage(

imageId,

{
tl:{
col:c + colOffset + 0.1,
row:currentRow - 0.9 + rowOffset
},

ext:{
width:70,
height:70
}

}

);

});

}

currentRow += 4;

}

sheet.columns.forEach(col=>{

col.width = 30;

});

let buffer =
await workbook.xlsx.writeBuffer();

saveAs(

new Blob([buffer]),

"البيانات.xlsx"

);

};

}

</script>

</body>

</html>
