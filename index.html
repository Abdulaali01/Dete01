<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام المواقع والبلاغات</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
* { box-sizing: border-box; font-family: tahoma; }
body { margin: 0; background: #ede7f6; padding: 20px; }
.container { max-width: 1100px; margin: auto; }
.top { height: 10px; background: #166534; border-radius: 16px 16px 0 0; }
.form { background: #fff; padding: 25px; border-radius: 0 0 16px 16px; }
.title { font-size: 32px; margin-bottom: 20px; font-weight: bold; color: #166534; }
.card { background: #fff; border: 1px solid #ddd; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
.label { display: block; margin-bottom: 10px; font-size: 18px; }
input[type=text], input[type=datetime-local] { width: 100%; border: none; border-bottom: 2px solid #ccc; padding: 12px; font-size: 16px; outline: none; }
input:focus { border-bottom: 2px solid #166534; }
.previewGrid, .imageCell { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
.preview, .imageCell img { width: 100%; height: 100px; object-fit: cover; border-radius: 10px; border: 1px solid #ccc; }
.toolbar { position: fixed; left: 20px; top: 120px; z-index: 999; }
.toolBtn { width: 60px; height: 60px; border: none; border-radius: 14px; font-size: 30px; background: #166534; color: #fff; cursor: pointer; }
.btn { background: #166534; color: #fff; border: none; border-radius: 10px; padding: 15px; width: 100%; font-size: 18px; cursor: pointer; margin-top: 10px; }
.copyBtn, .addImgBtn { background: #166534; color: #fff; border: none; border-radius: 10px; padding: 10px; margin-top: 10px; cursor: pointer; }
.adminBtn { background: #111; color: #fff; border: none; border-radius: 10px; padding: 12px; width: 100%; font-size: 16px; margin-top: 10px; cursor: pointer; }
table { width: 100%; border-collapse: collapse; background: #fff; margin-bottom: 25px; }
th, td { border: 1px solid #ccc; padding: 10px; text-align: center; vertical-align: top; word-wrap: break-word; overflow-wrap: break-word; max-width: 200px; }
th { background: #166534; color: #fff; font-weight: bold; font-size: 16px; }
.searchBox { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #ccc; font-size: 18px; }
.progressBox { width: 100%; height: 26px; background: #ddd; border-radius: 20px; overflow: hidden; margin-bottom: 15px; }
.progressBar { height: 100%; width: 0%; background: #166534; color: #fff; text-align: center; line-height: 26px; font-size: 14px; }
.filterBox { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
.filterBox input { flex: 1; }
.filterBox button { border: none; border-radius: 10px; color: #fff; padding: 12px 18px; cursor: pointer; background: #166534; }
.actionBtns { display: flex; flex-direction: column; gap: 8px; }

/* Site image styles */
.siteImgGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
.siteImgGrid img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
.site-img-upload { margin-top: 10px; padding: 15px; border: 2px dashed #166534; border-radius: 10px; text-align: center; cursor: pointer; background: #f0fdf4; }
.site-img-upload:hover { background: #dcfce7; }
.site-img-cell { text-align: center; vertical-align: middle; }
.site-img-cell img { width: 100%; max-width: 260px; height: 220px; object-fit: cover; border-radius: 10px; display: block; margin: 0 auto; }

/* Alternating border colors */
.imageCell > div:nth-child(odd) img { border: 3px solid #ffffff !important; outline: 1px solid #ccc; }
.imageCell > div:nth-child(even) img { border: 3px solid #000000 !important; outline: 1px solid #ccc; }
.siteImgGrid > div:nth-child(odd) img { border: 3px solid #ffffff !important; outline: 1px solid #ccc; }
.siteImgGrid > div:nth-child(even) img { border: 3px solid #000000 !important; outline: 1px solid #ccc; }

/* Modal */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10000; display: none; justify-content: center; align-items: center; }
.modal-box { background: #fff; border-radius: 16px; padding: 25px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; direction: rtl; }
.modal-title { font-size: 24px; font-weight: bold; color: #166534; margin-bottom: 20px; text-align: center; }
.modal-field { margin-bottom: 15px; }
.modal-field label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 16px; }
.modal-field input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
.modal-btns { display: flex; gap: 10px; margin-top: 20px; }
.modal-btns button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; }
.save-btn { background: #166534; color: #fff; }
.cancel-btn { background: #dc2626; color: #fff; }

/* Print button */
.print-btn { background: #2563eb !important; }

/* Print styles */
@media print {
body { background: #fff !important; padding: 0 !important; margin: 0 !important; }
.toolbar, .filterBox, .searchBox, .progressBox, .adminBtn, .btn:not(.print-btn), .actionBtns, .modal-overlay, .site-img-upload, .addImgBtn, .copyBtn { display: none !important; }
.container { max-width: 100% !important; margin: 0 !important; }

/* Each table on its own page */
#tableContainer > table { 
width: 100% !important; 
page-break-before: always !important; 
page-break-inside: avoid !important; 
margin-bottom: 0 !important; 
border: 2px solid #166534 !important;
}
#tableContainer > table:first-child { page-break-before: auto !important; }

th { background: #166534 !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-size: 14px !important; padding: 8px !important; word-wrap: break-word !important; }
td { padding: 8px !important; font-size: 13px !important; word-wrap: break-word !important; overflow-wrap: break-word !important; word-break: break-word !important; }
.imageCell { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 15px !important; padding: 10px !important; }
.imageCell img { width: 100% !important; height: auto !important; max-height: 180px !important; object-fit: contain !important; page-break-inside: avoid !important; break-inside: avoid !important; }
.imageCell > div:nth-child(odd) img { border: 4px solid #ffffff !important; outline: 2px solid #000 !important; }
.imageCell > div:nth-child(even) img { border: 4px solid #000000 !important; outline: 2px solid #fff !important; }
tr { page-break-inside: avoid !important; break-inside: avoid !important; }
td, th { page-break-inside: avoid !important; break-inside: avoid !important; }
input[type="checkbox"] { display: none !important; }
.imageCell label { display: none !important; }
.site-images-row label { display: block !important; font-size: 12px !important; color: #166534 !important; margin-top: 5px !important; }

/* Site images row in print - full content visible */
td[colspan] { background: #f0fdf4 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; padding: 15px !important; }
td[colspan] .site-images-row { display: flex !important; flex-wrap: nowrap !important; justify-content: center !important; gap: 15px !important; align-items: flex-start !important; }
td[colspan] .site-images-row > div { flex: 1 1 0 !important; max-width: none !important; min-width: 0 !important; page-break-inside: avoid !important; break-inside: avoid !important; }
td[colspan] .site-images-row img { width: 100% !important; height: auto !important; max-height: 280px !important; object-fit: contain !important; border-radius: 10px !important; page-break-inside: avoid !important; break-inside: avoid !important; display: block !important; background: #fff !important; }
td[colspan] .site-images-row > div:nth-child(odd) img { border: 5px solid #ffffff !important; outline: 2px solid #000 !important; }
td[colspan] .site-images-row > div:nth-child(even) img { border: 5px solid #000000 !important; outline: 2px solid #fff !important; }
}
</style>
</head>
<body>

<div class="toolbar">
<button class="toolBtn" onclick="addField()">+</button>
</div>

<div class="container">
<div class="top"></div>
<div class="form">
<div class="title">نظام المواقع والبلاغات</div>
<div id="questions"></div>
<button class="btn" onclick="sendData()">إرسال</button>
<button class="adminBtn" onclick="openAdmin()">لوحة الإدارة</button>
</div>
</div>

<!-- Admin Panel Container (hidden initially) -->
<div id="adminPanel" style="display:none; padding:20px;">
<h2>البيانات المستلمة</h2>
<button onclick="exportExcel()" class="btn">تصدير Excel</button>
<button onclick="clearDatabase()" class="btn" style="background:#dc2626">حذف البيانات</button>
<button onclick="window.print()" class="btn print-btn">طباعة</button>

<div class="progressBox">
<div class="progressBar" id="storageBar">0%</div>
</div>

<div class="filterBox">
<input type="datetime-local" id="fromDate">
<input type="datetime-local" id="toDate">
<button onclick="filterByDate()">فلترة</button>
<button onclick="resetFilter()" style="background:#dc2626">إلغاء الفلترة</button>
</div>

<input type="text" id="searchBox" class="searchBox" placeholder="بحث شامل..." onkeyup="searchTables()">
<div id="tableContainer"></div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal-overlay">
<div class="modal-box">
<div class="modal-title">تحديث البيانات</div>
<div id="editForm"></div>
<div class="modal-btns">
<button class="save-btn" onclick="saveEdit()">حفظ التغييرات</button>
<button class="cancel-btn" onclick="closeEdit()">إلغاء</button>
</div>
</div>
</div>

<script>
const ADMIN_PASSWORD = "481481";
let db;
let originalData = [];
let filteredExportData = [];
let currentEditId = null;

let request = indexedDB.open("SITE_DB", 1);

request.onupgradeneeded = function(e) {
db = e.target.result;
if (!db.objectStoreNames.contains("records")) {
db.createObjectStore("records", { keyPath: "id", autoIncrement: true });
}
};

request.onsuccess = function(e) {
db = e.target.result;
};

createGroup();
addField();

function createGroup() {
let q = document.getElementById("questions");
let wrap = document.createElement("div");
wrap.className = "groupBlock";
wrap.innerHTML = `
<div class="card">
<label class="label">اسم الموقع</label>
<input type="text" class="siteName" placeholder="اكتب اسم الموقع">
</div>
<div class="card">
<label class="label">رابط الموقع من الخريطة</label>
<input type="text" class="siteLink" readonly>
<button class="copyBtn" onclick="copyLocation(this)">نسخ رابط الموقع الحالي</button>
</div>
<div class="card">
<label class="label">صور الموقع</label>
<div class="site-img-upload" onclick="this.querySelector('.siteImgInput').click()">
<input type="file" class="siteImgInput" accept="image/*" style="display:none" onchange="previewSiteImage(this)">
<span style="color:#166534;font-size:16px;">+ إضافة صور الموقع (اكبس هنا)</span>
</div>
<div class="siteImgGrid"></div>
</div>
`;
q.appendChild(wrap);
}

function previewSiteImage(input) {
let file = input.files[0];
if (!file) return;
let grid = input.closest('.card').querySelector('.siteImgGrid');
if (grid.querySelectorAll('img').length >= 4) {
alert("الحد الأقصى 4 صور للموقع");
return;
}
let reader = new FileReader();
reader.onload = function(ev) {
let box = document.createElement('div');
box.style.position = 'relative';
box.innerHTML = `
<img src="${ev.target.result}" style="width:100%;height:120px;object-fit:cover;border-radius:8px;">
<button onclick="this.parentElement.remove()" style="position:absolute;top:5px;right:5px;background:#dc2626;color:#fff;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:12px;">×</button>
`;
grid.appendChild(box);
};
reader.readAsDataURL(file);
}

function copyLocation(btn) {
navigator.geolocation.getCurrentPosition(function(pos) {
let link = "https://maps.google.com/?q=" + pos.coords.latitude + "," + pos.coords.longitude;
btn.parentElement.querySelector(".siteLink").value = link;
navigator.clipboard.writeText(link);
alert("تم نسخ الرابط");
});
}

function addField() {
let groups = document.querySelectorAll(".groupBlock");
let lastGroup = groups[groups.length - 1];
let currentFields = lastGroup.querySelectorAll(".dynamicField");
if (currentFields.length >= 3) {
createGroup();
groups = document.querySelectorAll(".groupBlock");
lastGroup = groups[groups.length - 1];
}
let field = document.createElement("div");
field.className = "card dynamicField";
field.innerHTML = `
<input type="text" class="fieldName" placeholder="اكتب اسم العمود"><br><br>
<input type="text" class="fieldValue" placeholder="اكتب القيمة">
<button type="button" class="addImgBtn">+ إضافة صور</button>
<div class="previewGrid"></div>
`;
lastGroup.appendChild(field);
let btn = field.querySelector(".addImgBtn");
btn.onclick = function() {
let grid = field.querySelector(".previewGrid");
if (grid.querySelectorAll(".preview").length >= 4) {
alert("الحد الأقصى 4 صور");
return;
}
let box = document.createElement("div");
box.innerHTML = `
<input type="file" accept="image/*" class="imgInput">
<img class="preview">
`;
grid.appendChild(box);
let input = box.querySelector(".imgInput");
let img = box.querySelector(".preview");
input.onchange = function(e) {
let file = e.target.files[0];
if (!file) return;
let reader = new FileReader();
reader.onload = function(ev) {
img.src = ev.target.result;
};
reader.readAsDataURL(file);
};
};
}

function sendData() {
let groups = document.querySelectorAll(".groupBlock");
let tx = db.transaction("records", "readwrite");
let store = tx.objectStore("records");
groups.forEach(group => {
let row = {};
row["اسم الموقع"] = group.querySelector(".siteName").value;
row["رابط الموقع"] = group.querySelector(".siteLink").value;
row["تاريخ الحفظ"] = new Date().toLocaleString("ar-EG");

// Site images
let siteImgs = group.querySelectorAll('.siteImgGrid img');
siteImgs.forEach((img, i) => {
if (img.src) {
row["صور الموقع " + (i + 1)] = img.src;
}
});

let fields = group.querySelectorAll(".dynamicField");
fields.forEach(field => {
let name = field.querySelector(".fieldName").value || "بدون اسم";
let value = field.querySelector(".fieldValue").value;
row[name] = value;
let previews = field.querySelectorAll(".preview");
previews.forEach((img, i) => {
if (img.src) {
row[name + " صورة " + (i + 1)] = img.src;
}
});
});
store.add(row);
});
tx.oncomplete = function() {
alert("تم حفظ البيانات");
};
}

function openAdmin() {
let pass = prompt("أدخل كلمة المرور");
if (pass !== ADMIN_PASSWORD) {
alert("كلمة المرور خطأ");
return;
}
// Hide main form, show admin panel
document.querySelector('.container').style.display = 'none';
document.querySelector('.toolbar').style.display = 'none';
document.getElementById('adminPanel').style.display = 'block';
loadData();
}

function loadData() {
let tx = db.transaction("records", "readonly");
let store = tx.objectStore("records");
let getAll = store.getAll();
getAll.onsuccess = function() {
originalData = getAll.result;
renderTables(originalData);
updateBar(originalData);
};
}

function renderTables(data) {
filteredExportData = data;
let div = document.getElementById("tableContainer");
div.innerHTML = "";

data.forEach((row, rowIndex) => {
let table = document.createElement("table");

// Count columns (data columns + actions)
let dataKeys = Object.keys(row).filter(k => k != "id" && !k.includes(" صورة ") && !k.startsWith("صور الموقع"));
let colCount = dataKeys.length + 1; // +1 for actions

// === HEADER ROW ===
let tr1 = document.createElement("tr");
Object.keys(row).forEach(k => {
if (k != "id" && !k.includes(" صورة ") && !k.startsWith("صور الموقع")) {
let th = document.createElement("th");
th.innerText = k;
tr1.appendChild(th);
}
});
let thWA = document.createElement("th");
thWA.innerText = "الإجراءات";
tr1.appendChild(thWA);
table.appendChild(tr1);

// === DATA ROW ===
let tr2 = document.createElement("tr");
Object.keys(row).forEach(k => {
if (k != "id" && !k.includes(" صورة ") && !k.startsWith("صور الموقع")) {
let td = document.createElement("td");
td.innerHTML = `<div style="word-break:break-word;overflow-wrap:break-word;">${row[k] || ""}</div>`;
let imgs = [];
Object.keys(row).forEach(imgKey => {
if (imgKey.startsWith(k + " صورة")) {
imgs.push(row[imgKey]);
}
});
if (imgs.length) {
let box = document.createElement("div");
box.className = "imageCell";
imgs.forEach(img => {
box.innerHTML += `
<div>
<img src="${img}">
<label>
<input type="checkbox" class="waImage" data-row="${rowIndex}" data-img="${img}" checked>
إرسال
</label>
</div>
`;
});
td.appendChild(box);
}
tr2.appendChild(td);
}
});
let tdWA = document.createElement("td");
tdWA.innerHTML = `
<div class="actionBtns">
<button onclick="sendWhatsApp(${rowIndex})" style="background:#25D366;color:#fff;border:none;padding:10px;border-radius:10px;cursor:pointer;">واتساب</button>
<button onclick="openEdit(${rowIndex})" style="background:#f59e0b;color:#fff;border:none;padding:10px;border-radius:10px;cursor:pointer;">تحديث</button>
<button onclick="deleteRow(${rowIndex})" style="background:#dc2626;color:#fff;border:none;padding:10px;border-radius:10px;cursor:pointer;">حذف</button>
</div>
`;
tr2.appendChild(tdWA);
table.appendChild(tr2);

// === SITE IMAGES ROW (full width, below all columns) ===
let siteImgKeys = Object.keys(row).filter(k => k.startsWith("صور الموقع")).slice(0, 4);
if (siteImgKeys.length > 0) {
let tr3 = document.createElement("tr");
let td3 = document.createElement("td");
td3.colSpan = colCount;
td3.style.background = "#f8fafc";
td3.style.padding = "20px";
td3.style.textAlign = "center";

let titleDiv = document.createElement("div");
titleDiv.innerText = "صور الموقع";
titleDiv.style.fontWeight = "bold";
titleDiv.style.color = "#166534";
titleDiv.style.marginBottom = "15px";
titleDiv.style.fontSize = "18px";
td3.appendChild(titleDiv);

let siteBox = document.createElement("div");
siteBox.className = "site-images-row";
siteBox.style.display = "flex";
siteBox.style.flexWrap = "wrap";
siteBox.style.justifyContent = "center";
siteBox.style.gap = "15px";
siteBox.style.alignItems = "flex-start";

siteImgKeys.forEach((imgKey, idx) => {
let imgDiv = document.createElement("div");
imgDiv.style.flex = "0 0 auto";
imgDiv.style.width = "calc(25% - 15px)";
imgDiv.style.minWidth = "180px";
imgDiv.style.maxWidth = "240px";
imgDiv.innerHTML = `
<img src="${row[imgKey]}" style="width:100%;height:200px;object-fit:contain;border-radius:10px;display:block;background:#fff;">
<label style="display:block;margin-top:5px;font-size:13px;color:#166534;">
<input type="checkbox" class="waImage" data-row="${rowIndex}" data-img="${row[imgKey]}" checked>
إرسال واتساب
</label>
`;
siteBox.appendChild(imgDiv);
});

td3.appendChild(siteBox);
tr3.appendChild(td3);
table.appendChild(tr3);
}

div.appendChild(table);
});

window.currentTableData = data;
}

function searchTables() {
let val = document.getElementById("searchBox").value.toLowerCase();
let tables = document.querySelectorAll("#tableContainer table");
let visibleData = [];
tables.forEach((table, idx) => {
let text = table.innerText.toLowerCase();
if (text.includes(val)) {
table.style.display = "";
visibleData.push(window.currentTableData[idx]);
} else {
table.style.display = "none";
}
});
filteredExportData = visibleData;
}

function parseArabicDate(raw) {
let nums = String(raw).match(/\d+/g);
if (!nums || nums.length < 6) return null;
return new Date(parseInt(nums[2]), parseInt(nums[1]) - 1, parseInt(nums[0]), parseInt(nums[3]), parseInt(nums[4]), parseInt(nums[5]));
}

function filterByDate() {
let from = document.getElementById("fromDate").value;
let to = document.getElementById("toDate").value;
let filtered = originalData.filter(r => {
let d = parseArabicDate(r["تاريخ الحفظ"]);
if (!d) return false;
let ok = true;
if (from) ok = ok && d >= new Date(from);
if (to) ok = ok && d <= new Date(to);
return ok;
});
renderTables(filtered);
filteredExportData = filtered;
}

function resetFilter() {
renderTables(originalData);
let searchBox = document.getElementById("searchBox");
if (searchBox) searchBox.value = "";
filteredExportData = originalData;
}

function updateBar(data) {
let text = JSON.stringify(data);
let size = new Blob([text]).size;
let max = 50 * 1024 * 1024;
let percent = Math.min((size / max) * 100, 100);
let bar = document.getElementById("storageBar");
bar.style.width = percent + "%";
bar.innerHTML = percent.toFixed(1) + "%";
}

function clearDatabase() {
if (!confirm("حذف جميع البيانات؟")) return;
let tx = db.transaction("records", "readwrite");
let store = tx.objectStore("records");
store.clear();
tx.oncomplete = function() {
alert("تم حذف البيانات");
loadData();
};
}

// ========== EDIT FUNCTIONS ==========

function openEdit(rowIndex) {
let row = window.currentTableData[rowIndex];
if (!row) return;
currentEditId = row.id;
let formDiv = document.getElementById("editForm");
formDiv.innerHTML = "";
Object.keys(row).forEach(k => {
if (k === "id" || k.includes(" صورة ") || k.startsWith("صور الموقع")) return;
let fieldDiv = document.createElement("div");
fieldDiv.className = "modal-field";
let label = document.createElement("label");
label.innerText = k;
let input = document.createElement("input");
input.type = "text";
input.value = row[k] || "";
input.dataset.key = k;
fieldDiv.appendChild(label);
fieldDiv.appendChild(input);
formDiv.appendChild(fieldDiv);
});
document.getElementById("editModal").style.display = "flex";
}

function closeEdit() {
document.getElementById("editModal").style.display = "none";
currentEditId = null;
}

function saveEdit() {
if (!currentEditId) return;
let inputs = document.querySelectorAll("#editForm input");
let updates = {};
inputs.forEach(input => {
updates[input.dataset.key] = input.value;
});
let tx = db.transaction("records", "readwrite");
let store = tx.objectStore("records");
let getReq = store.get(currentEditId);
getReq.onsuccess = function() {
let existing = getReq.result;
if (!existing) {
alert("لم يتم العثور على السجل");
return;
}
Object.keys(updates).forEach(key => {
existing[key] = updates[key];
});
let putReq = store.put(existing);
putReq.onsuccess = function() {
alert("تم التحديث بنجاح");
closeEdit();
loadData();
};
putReq.onerror = function() {
alert("فشل التحديث");
};
};
}

function deleteRow(rowIndex) {
let row = window.currentTableData[rowIndex];
if (!row || !row.id) return;
if (!confirm("هل أنت متأكد من حذف هذا السجل؟")) return;
let tx = db.transaction("records", "readwrite");
let store = tx.objectStore("records");
let delReq = store.delete(row.id);
delReq.onsuccess = function() {
alert("تم الحذف بنجاح");
loadData();
};
delReq.onerror = function() {
alert("فشل الحذف");
};
}

function dataURLtoFile(dataurl, filename) {
let arr = dataurl.split(',');
let mime = arr[0].match(/:(.*?);/)[1];
let bstr = atob(arr[1]);
let n = bstr.length;
let u8arr = new Uint8Array(n);
while (n--) {
u8arr[n] = bstr.charCodeAt(n);
}
return new File([u8arr], filename, { type: mime });
}

function isMobile() {
return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
}

async function sendWhatsApp(index) {
let row = window.currentTableData[index];

// Build text with all row data (excluding id and image keys)
let text = "*بيانات الموقع*\n\n";
Object.keys(row).forEach(k => {
if (k != "id" && !k.includes(" صورة ") && !k.startsWith("صور الموقع")) {
text += "*" + k + "* : " + row[k] + "\n";
}
});

let selected = document.querySelectorAll('.waImage[data-row="' + index + '"]:checked');
if (!selected.length) {
alert("اختر صورة واحدة على الأقل");
return;
}

let imgSrc = selected[0].getAttribute("data-img");
let file = dataURLtoFile(imgSrc, "image.jpg");

// Try native share API (best for mobile - sends image + text together)
try {
if (navigator.canShare && navigator.canShare({ files: [file] })) {
await navigator.share({ files: [file], text: text });
return;
}
} catch (err) {
// User cancelled the share sheet
if (err.name === 'AbortError') return;
console.log("Share error:", err);
}

// Fallback: Mobile - open WhatsApp with text
if (isMobile()) {
let waUrl = "whatsapp://send?text=" + encodeURIComponent(text);
window.location.href = waUrl;
return;
}

// Fallback: Desktop - open WhatsApp Web
window.open("https://web.whatsapp.com", "_blank");
navigator.clipboard.writeText(text).catch(function(){});
}

async function exportExcel() {
let workbook = new ExcelJS.Workbook();
let sheet = workbook.addWorksheet("البيانات");
let data = filteredExportData;
if (!data.length) {
alert("لا توجد بيانات");
return;
}
let headers = [];
data.forEach(row => {
Object.keys(row).forEach(k => {
if (k != "id" && !k.includes(" صورة ") && !k.startsWith("صور الموقع") && !headers.includes(k)) {
headers.push(k);
}
});
});
let hasSiteImages = data.some(row => Object.keys(row).some(k => k.startsWith("صور الموقع")));
if (hasSiteImages && !headers.includes("صور الموقع")) {
headers.push("صور الموقع");
}

let headerRow = sheet.addRow(headers);
headerRow.eachCell(cell => {
cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "166534" } };
cell.font = { bold: true, color: { argb: "FFFFFF" }, size: 14 };
cell.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
});

for (let r = 0; r < data.length; r++) {
let rowData = data[r];
let values = [];
headers.forEach(h => {
if (h === "صور الموقع") {
let siteImgs = [];
Object.keys(rowData).forEach(k => {
if (k.startsWith("صور الموقع")) {
siteImgs.push(rowData[k]);
}
});
values.push(siteImgs.length > 0 ? "صور: " + siteImgs.length : "");
} else {
values.push(rowData[h] || "");
}
});
let row = sheet.addRow(values);
row.height = 120;
for (let c = 0; c < headers.length; c++) {
let key = headers[c];
let images = [];
Object.keys(rowData).forEach(imgKey => {
if (imgKey.startsWith(key + " صورة")) {
images.push(rowData[imgKey]);
}
});
images.slice(0, 4).forEach((img, index) => {
let extension = img.includes("png") ? "png" : "jpeg";
let imageId = workbook.addImage({ base64: img, extension: extension });
let colOffset = (index % 2) * 0.42;
let rowOffset = (index >= 2 ? 0.42 : 0);
sheet.addImage(imageId, {
tl: { col: c + colOffset + 0.05, row: row.number - 0.9 + rowOffset },
ext: { width: 55, height: 55 }
});
});
}
}

sheet.columns.forEach(col => {
col.width = 28;
});
sheet.eachRow(row => {
row.eachCell(cell => {
cell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
cell.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
});
});

let buffer = await workbook.xlsx.writeBuffer();
saveAs(new Blob([buffer]), "البيانات.xlsx");
}
</script>
